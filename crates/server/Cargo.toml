[package]
name = "remotecontrol-server"
version = "0.1.0"
edition = "2021"
description = "RemoteControl 被控端服务"

[features]
default = ["x11"]
x11 = []
wayland = []

[dependencies]
# Web 服务器 + 异步运行时
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 认证 / 会话
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }

# 配置 / 命令行
clap = { version = "4", features = ["derive"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"
thiserror = "1"

# 输入注入
enigo = "0.6.1"

# 屏幕捕获（M3）- 纯 Rust X11 客户端，调用 XGetImage，无额外 C 库依赖
x11rb = "0.13"

# 视频编码（M3）
openh264 = { version = "0.6", features = ["source"] }
