[package]
name = "remotecontrol-server"
version = "0.1.0"
edition = "2021"
description = "RemoteControl 被控端服务"

[features]
# 默认同时启用 x11 与 wayland：Linux 下的同一份二进制能在启动时
# 通过 WAYLAND_DISPLAY / XDG_SESSION_TYPE 自动切到对应后端。
default = ["x11", "wayland"]
x11 = []
# Wayland 支持：当前实现以 Xwayland 作为桥接（复用 x11rb 与 XTest），
# 因此启用 wayland 时自动带上 x11 编译单元；后续接入 PipeWire/portal 时
# 会再拆分为独立后端。
wayland = ["x11"]

[dependencies]
# Web 服务器 + 异步运行时
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"

# 认证 / 会话
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }

# 配置 / 命令行
clap = { version = "4", features = ["derive"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"
thiserror = "1"

# 输入注入
enigo = "0.6.1"

# 屏幕捕获（M3）- 纯 Rust X11 客户端，支持 MIT-SHM 共享内存扩展
x11rb = { version = "0.13", features = ["shm", "xtest", "xfixes"] }
libc = "0.2"

# 系统剪切板：Linux 默认走 x11rb 后端，与本项目已有依赖一致；
# 关闭 wayland-data-control 默认特性，避免引入额外系统依赖（Wayland 支持后再开）。
arboard = { version = "3", default-features = false }

# 视频编码（M3）
openh264 = { version = "0.6", features = ["source"] }

# TLS（M4）— 统一使用 ring 后端，避免 aws-lc-sys 的 C 编译/链接负担。
# axum-server 用 tls-rustls-no-provider，避免它强制开启 rustls/aws-lc-rs。
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Windows 屏幕捕获（Desktop Duplication API）+ 输入注入（SendInput API）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",  # SendInput 精确滚轮控制
    "Win32_UI_HiDpi",                    # DPI 感知
]}
