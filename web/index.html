<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteControl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>RemoteControl</h1>
        <p class="status" id="status">未连接</p>
        <div class="info" id="auth-panel">
            <form id="auth-form" class="auth-form">
                <input
                    type="password"
                    id="password"
                    class="field"
                    placeholder="请输入访问密码"
                    autocomplete="current-password"
                />
                <button type="submit" id="connect-btn" class="btn">连接</button>
            </form>
            <p class="hint" id="hint">输入密码后点击连接，验证 M1 认证流程。</p>
        </div>

        <!-- M2：认证后显示的输入采集区。M3 起此处会绘制视频画面。 -->
        <div class="control-panel" id="control-panel" hidden>
            <div
                id="control-surface"
                class="control-surface"
                tabindex="0"
                aria-label="远程控制输入区域：在此移动/点击鼠标、按键将注入到被控端"
            >
                <canvas id="video-canvas" width="1920" height="1080"></canvas>
            </div>
            <p class="hint" id="control-hint">认证后即可发送输入。</p>
        </div>
    </div>

    <!-- 剪切板同步浮层提示：抽屉收起时也能看到同步方向，避免剪切板在用户无感知下被传走 -->
    <div class="clip-toast" id="clip-toast" role="status" aria-live="polite" hidden></div>

    <!-- 顶部悬浮抽屉：鼠标移到顶部细条上展开 -->
    <div class="top-drawer" id="top-drawer" hidden>
        <div class="drawer-trigger" aria-hidden="true"></div>
        <div class="drawer-content" role="toolbar" aria-label="远程控制工具栏">
            <button type="button" id="btn-back-login" class="drawer-btn">返回登录</button>
            <button type="button" id="btn-toggle-fullscreen" class="drawer-btn">全屏</button>
            <button type="button" id="btn-send-alt-f4" class="drawer-btn">Alt+F4</button>
            <button type="button" id="btn-send-ctrl-alt-del" class="drawer-btn">Ctrl+Alt+Del</button>
            <button
                type="button"
                id="btn-auto-clipboard"
                class="drawer-btn"
                title="开启后在画面内按 Ctrl+C / Ctrl+V 自动同步剪切板，方向由按键决定。右键菜单复制请用「读取远端剪切板」。"
            >自动剪切板：开</button>
            <button
                type="button"
                id="btn-send-clipboard"
                class="drawer-btn"
                title="把本地剪切板推到被控端。自动同步开启时按 Ctrl+V 即可，无需点此。"
            >传输本地剪切板</button>
            <button
                type="button"
                id="btn-read-clipboard"
                class="drawer-btn"
                title="从被控端取剪切板。在远程桌面用右键菜单复制、或远程程序自己写了剪切板时，点这里取回。"
            >读取远端剪切板</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
