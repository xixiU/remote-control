<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteControl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>RemoteControl</h1>
        <p class="status" id="status">未连接</p>
        <div class="info">
            <form id="auth-form" class="auth-form">
                <input
                    type="password"
                    id="password"
                    class="field"
                    placeholder="请输入访问密码"
                    autocomplete="current-password"
                />
                <button type="submit" id="connect-btn" class="btn">连接</button>
            </form>
            <p class="hint" id="hint">输入密码后点击连接，验证 M1 认证流程。</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
